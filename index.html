<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia de Muertos | Ofrenda Interactiva</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --candle-glow: 1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #1f0628;
            /* Patrón de papel tapiz floral/damasco morado oscuro idéntico al fondo de la imagen */
            background-image: 
                radial-gradient(circle at 50% 34%, rgba(255, 175, 40, calc(0.16 * var(--candle-glow))), transparent 55%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%232c0b3a' fill-opacity='0.65'%3E%3Cpath d='M60 12c-8 0-14 6-14 14 0 5 3 9 6 12-7 2-12 8-12 15 0 9 7 15 16 15h8c9 0 16-6 16-15 0-7-5-13-12-15 3-3 6-7 6-12 0-8-6-14-14-14zm-5 13a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm10 0a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-5 8l3 5h-6l3-5z'/%3E%3Cpath d='M20 75c6-6 16-6 22 0 6 6 6 16 0 22-6 6-16 6-22 0-6-6-6-16 0-22zm80 0c-6-6-16-6-22 0-6 6-6 16 0 22 6 6 16 6 22 0 6-6 6-16 0-22z' opacity='0.45'/%3E%3Ccircle cx='60' cy='95' r='8' opacity='0.5'/%3E%3Ccircle cx='15' cy='25' r='6' opacity='0.4'/%3E%3Ccircle cx='105' cy='25' r='6' opacity='0.4'/%3E%3C/g%3E%3C/svg%3E");
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Franja de piso oscuro en la base como en la ilustración */
        .floor-backdrop {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 15vh;
            background: #14031c;
            z-index: 0;
            border-top: 2px solid #2b0b38;
        }

        /* Tipografía del título curvo "Día de Muertos" */
        .title-svg-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            fill: #d56ce8;
            letter-spacing: 2px;
            filter: drop-shadow(0 4px 10px rgba(213, 108, 232, 0.28));
        }

        /* Flamas de las veladoras */
        @keyframes flameFlicker {
            0%, 100% { transform: scale(1) rotate(-1.5deg); }
            25% { transform: scale(1.05, 0.96) rotate(2deg); }
            50% { transform: scale(0.95, 1.07) rotate(-2deg); }
            75% { transform: scale(1.04, 1.02) rotate(1.5deg); }
        }
        @keyframes flameGlowPulse {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.18); }
        }
        .candle-flame {
            transform-origin: 50% 90%;
            animation: flameFlicker 1.7s ease-in-out infinite;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .candle-halo {
            transform-origin: center;
            animation: flameGlowPulse 2.4s ease-in-out infinite;
            transition: opacity 0.35s ease;
        }
        .candle-off .candle-flame,
        .candle-off .candle-halo {
            opacity: 0 !important;
            transform: scale(0) !important;
        }

        /* Humo de los copaleros */
        @keyframes copalFloatLeft {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.85; }
            50% { transform: translateY(-8px) scale(1.05, 1.08) rotate(-2deg); opacity: 0.98; }
        }
        @keyframes copalFloatRight {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.85; }
            50% { transform: translateY(-9px) scale(1.06, 1.08) rotate(2deg); opacity: 0.98; }
        }
        @keyframes smokeWispRise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            30% { opacity: 0.65; }
            100% { transform: translateY(-55px) scale(1.35); opacity: 0; }
        }
        .copal-plume-left {
            transform-origin: 50% 100%;
            animation: copalFloatLeft 3.6s ease-in-out infinite;
        }
        .copal-plume-right {
            transform-origin: 50% 100%;
            animation: copalFloatRight 3.9s ease-in-out infinite;
        }
        .extra-wisp {
            animation: smokeWispRise 3.2s ease-out infinite;
        }

        /* Vapor del jarrito */
        @keyframes steamWave {
            0% { stroke-dashoffset: 40; opacity: 0.25; transform: translateY(2px); }
            50% { opacity: 0.75; }
            100% { stroke-dashoffset: 0; opacity: 0.15; transform: translateY(-8px); }
        }
        .jarrito-steam {
            stroke-dasharray: 20;
            animation: steamWave 2.8s linear infinite;
        }

        /* Papel picado con movimiento suave */
        @keyframes papelWave {
            0%, 100% { transform: rotate(0deg) skewX(0deg); }
            50% { transform: rotate(0.9deg) skewX(1.2deg); }
        }
        @keyframes papelWaveAlt {
            0%, 100% { transform: rotate(0deg) skewX(0deg); }
            50% { transform: rotate(-0.9deg) skewX(-1.2deg); }
        }
        .papel-banner {
            transform-origin: top center;
            animation: papelWave 4.2s ease-in-out infinite;
            transition: filter 0.25s ease, transform 0.25s ease;
            cursor: pointer;
        }
        .papel-banner-alt {
            transform-origin: top center;
            animation: papelWaveAlt 4.7s ease-in-out infinite;
            transition: filter 0.25s ease, transform 0.25s ease;
            cursor: pointer;
        }
        .papel-banner:hover, .papel-banner-alt:hover {
            filter: brightness(1.15) drop-shadow(0 4px 10px rgba(255, 255, 255, 0.25));
        }

        /* =================================================================
           ANIMACIONES INTERACTIVAS DE LAS 3 CALAVERITAS DE AZÚCAR
           ================================================================= */
        .calaverita-group {
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center bottom;
            transition: filter 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .calaverita-group:hover {
            filter: drop-shadow(0 0 14px rgba(255, 214, 10, 0.75));
            transform: translateY(-5px) scale(1.04);
        }

        /* Calaverita 1 (Izquierda): Giro festivo, salto y guiño */
        @keyframes skullDanceLeft {
            0%   { transform: translateY(0) rotate(0deg) scale(1); }
            15%  { transform: translateY(-26px) rotate(-18deg) scale(1.12); }
            35%  { transform: translateY(-10px) rotate(16deg) scale(1.08); }
            55%  { transform: translateY(-28px) rotate(-14deg) scale(1.14); }
            75%  { transform: translateY(-6px) rotate(10deg) scale(1.05); }
            90%  { transform: translateY(-14px) rotate(-5deg) scale(1.06); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        /* Calaverita 2 (Centro): Zapateado alegre y carcajada */
        @keyframes skullDanceCenter {
            0%   { transform: translateY(0) scale(1); }
            12%  { transform: translateY(-30px) scale(1.14, 0.92); }
            25%  { transform: translateY(0) scale(0.94, 1.1) rotate(-8deg); }
            40%  { transform: translateY(-26px) scale(1.12) rotate(8deg); }
            55%  { transform: translateY(0) scale(0.95, 1.08) rotate(-6deg); }
            70%  { transform: translateY(-22px) scale(1.1) rotate(6deg); }
            85%  { transform: translateY(-5px) scale(1.04); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }
        /* Calaverita 3 (Derecha): Danza floral de Cempasúchil */
        @keyframes skullDanceRight {
            0%   { transform: translateY(0) rotate(0deg) scale(1); }
            20%  { transform: translateY(-24px) rotate(18deg) scale(1.12); }
            40%  { transform: translateY(-12px) rotate(-15deg) scale(1.1); }
            60%  { transform: translateY(-26px) rotate(14deg) scale(1.15); }
            80%  { transform: translateY(-8px) rotate(-8deg) scale(1.06); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        /* Castañeteo de mandíbula y brillo ocular cuando bailan */
        @keyframes jawChatter {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(4px); }
            50% { transform: translateY(-1px); }
            75% { transform: translateY(5px); }
        }
        @keyframes eyeSparkle {
            0%, 100% { filter: drop-shadow(0 0 0px transparent); transform: scale(1); }
            50% { filter: drop-shadow(0 0 12px #00f5d4); transform: scale(1.22); }
        }

        .dancing-left {
            animation: skullDanceLeft 1.05s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite !important;
            filter: drop-shadow(0 0 20px rgba(255, 208, 0, 0.95)) !important;
        }
        .dancing-center {
            animation: skullDanceCenter 0.95s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite !important;
            filter: drop-shadow(0 0 20px rgba(235, 28, 116, 0.95)) !important;
        }
        .dancing-right {
            animation: skullDanceRight 1.05s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite !important;
            filter: drop-shadow(0 0 20px rgba(255, 153, 0, 0.95)) !important;
        }

        .dancing-left .skull-jaw,
        .dancing-center .skull-jaw,
        .dancing-right .skull-jaw {
            transform-box: fill-box;
            transform-origin: center top;
            animation: jawChatter 0.28s ease-in-out infinite;
        }
        .dancing-left .skull-eyes,
        .dancing-center .skull-eyes,
        .dancing-right .skull-eyes {
            transform-box: fill-box;
            transform-origin: center;
            animation: eyeSparkle 0.45s ease-in-out infinite;
        }

        /* Hover sutil para otros objetos del altar */
        .interactive-prop {
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center bottom;
            transition: transform 0.28s ease, filter 0.28s ease;
        }
        .interactive-prop:hover {
            transform: scale(1.04) translateY(-3px);
            filter: drop-shadow(0 4px 12px rgba(255, 190, 50, 0.45));
        }

        /* Contenedor principal de la escena SVG */
        .altar-stage {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.25rem 0.5rem 4.75rem;
        }
    </style>
</head>
<body>

    <!-- Piso oscuro del fondo -->
    <div class="floor-backdrop"></div>

    <!-- Canvas de Partículas Interactivas (Pétalos, chispas de azúcar y confeti cuando tocas las calaveritas) -->
    <canvas id="fxCanvas" class="fixed inset-0 pointer-events-none z-30"></canvas>

    <!-- =====================================================================
         ESCENA PRINCIPAL DEL ALTAR (Recreación exacta de image_a90522.jpg sin etiquetas)
         ===================================================================== -->
    <main class="altar-stage">
        <svg id="altarSvg" viewBox="0 0 1000 960" class="w-full h-auto max-h-[91vh] drop-shadow-[0_18px_40px_rgba(0,0,0,0.65)]" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Resplandor de las veladoras -->
                <radialGradient id="candleHaloGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffd166" stop-opacity="0.7"/>
                    <stop offset="55%" stop-color="#fb8500" stop-opacity="0.25"/>
                    <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
                </radialGradient>

                <!-- Sombra suave bajo objetos -->
                <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
                    <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#12021a" flood-opacity="0.55"/>
                </filter>

                <!-- Curva para el título "Día de Muertos" -->
                <path id="titleArcPath" d="M 185,175 Q 500,60 815,175" fill="none"/>

                <!-- Recorte exacto para la foto dentro del portarretratos -->
                <clipPath id="portraitPhotoClip">
                    <rect x="453" y="218" width="94" height="122" rx="2"/>
                </clipPath>
            </defs>

            <!-- =============================================================
                 1. TÍTULO ARQUEADO "Día de Muertos" (Sin etiquetas ni flechas)
                 ============================================================= -->
            <g id="headerTitleGroup" class="cursor-pointer" onclick="triggerAllSkullsDance()">
                <!-- Tres pinceladas decorativas lilas a la izquierda -->
                <g fill="#d56ce8">
                    <path d="M 162,155 Q 178,150 188,162 Q 174,167 162,155 Z" />
                    <path d="M 155,172 Q 175,169 187,181 Q 170,186 155,172 Z" />
                    <path d="M 164,191 Q 182,189 191,202 Q 174,205 164,191 Z" />
                </g>

                <!-- Texto curvo principal -->
                <text class="title-svg-text" font-size="68" text-anchor="middle">
                    <textPath href="#titleArcPath" startOffset="50%">Día de Muertos</textPath>
                </text>

                <!-- Tres pinceladas decorativas lilas a la derecha -->
                <g fill="#d56ce8">
                    <path d="M 838,155 Q 822,150 812,162 Q 826,167 838,155 Z" />
                    <path d="M 845,172 Q 825,169 813,181 Q 830,186 845,172 Z" />
                    <path d="M 836,191 Q 818,189 809,202 Q 826,205 836,191 Z" />
                </g>
            </g>

            <!-- =============================================================
                 2. ESTRUCTURA DE LOS 3 NIVELES MORADOS DEL ALTAR
                 ============================================================= -->
            
            <!-- NIVEL 3 (BASE INFERIOR MÁS ANCHA) -->
            <g id="tier3Structure">
                <!-- Cara frontal del 3er nivel -->
                <rect x="168" y="665" width="664" height="196" fill="#63347e" stroke="#2c0b3f" stroke-width="3"/>
                <!-- Superficie superior curva del 3er nivel -->
                <path d="M 168,665 Q 500,635 832,665 Q 500,715 168,665 Z" fill="#774396" stroke="#2c0b3f" stroke-width="3"/>
            </g>

            <!-- NIVEL 2 (NIVEL MEDIO) -->
            <g id="tier2Structure">
                <!-- Cara frontal del 2do nivel -->
                <rect x="242" y="478" width="516" height="185" fill="#63347e" stroke="#2c0b3f" stroke-width="3"/>
                <!-- Superficie superior curva del 2do nivel -->
                <path d="M 242,478 Q 500,452 758,478 Q 500,518 242,478 Z" fill="#774396" stroke="#2c0b3f" stroke-width="3"/>
            </g>

            <!-- NIVEL 1 (NIVEL SUPERIOR) -->
            <g id="tier1Structure">
                <!-- Cara frontal del 1er nivel -->
                <rect x="334" y="352" width="332" height="128" fill="#63347e" stroke="#2c0b3f" stroke-width="3"/>
                <!-- Superficie superior curva del 1er nivel -->
                <path d="M 334,352 Q 500,334 666,352 Q 500,376 334,352 Z" fill="#774396" stroke="#2c0b3f" stroke-width="3"/>

                <!-- Festón / Guirnalda amarilla y naranja en el borde superior del Nivel 1 -->
                <g id="topTierGarland">
                    <!-- 4 ondas festoneadas a lo largo del frente superior (x: 334 a 666) -->
                    <!-- Onda 1 -->
                    <path d="M 336,358 Q 377,418 418,358 Z" fill="#f9a825" stroke="#2c0b3f" stroke-width="2"/>
                    <path d="M 346,358 Q 377,396 408,358 Z" fill="#ef6c00"/>
                    <circle cx="356" cy="378" r="2.8" fill="#3e1305"/>
                    <circle cx="369" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="385" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="398" cy="378" r="2.8" fill="#3e1305"/>

                    <!-- Onda 2 -->
                    <path d="M 418,358 Q 459,418 500,358 Z" fill="#f9a825" stroke="#2c0b3f" stroke-width="2"/>
                    <path d="M 428,358 Q 459,396 490,358 Z" fill="#ef6c00"/>
                    <circle cx="438" cy="378" r="2.8" fill="#3e1305"/>
                    <circle cx="451" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="467" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="480" cy="378" r="2.8" fill="#3e1305"/>

                    <!-- Onda 3 -->
                    <path d="M 500,358 Q 541,418 582,358 Z" fill="#f9a825" stroke="#2c0b3f" stroke-width="2"/>
                    <path d="M 510,358 Q 541,396 572,358 Z" fill="#ef6c00"/>
                    <circle cx="520" cy="378" r="2.8" fill="#3e1305"/>
                    <circle cx="533" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="549" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="562" cy="378" r="2.8" fill="#3e1305"/>

                    <!-- Onda 4 -->
                    <path d="M 582,358 Q 623,418 664,358 Z" fill="#f9a825" stroke="#2c0b3f" stroke-width="2"/>
                    <path d="M 592,358 Q 623,396 654,358 Z" fill="#ef6c00"/>
                    <circle cx="602" cy="378" r="2.8" fill="#3e1305"/>
                    <circle cx="615" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="631" cy="389" r="2.8" fill="#3e1305"/>
                    <circle cx="644" cy="378" r="2.8" fill="#3e1305"/>

                    <!-- Línea superior naranja de unión -->
                    <rect x="334" y="353" width="332" height="7" fill="#ff9800" stroke="#2c0b3f" stroke-width="1.5"/>
                </g>
            </g>

            <!-- =============================================================
                 3. ELEMENTOS DEL NIVEL 1 (RETRATO DEL JOVEN DE TRAJE + 2 VELADORAS)
                 ============================================================= -->
            
            <!-- VELADORA IZQUIERDA -->
            <g id="candleLeft" class="interactive-prop" onclick="toggleCandle(0)" filter="url(#softShadow)">
                <!-- Halo luminoso -->
                <circle cx="396" cy="260" r="46" fill="url(#candleHaloGrad)" class="candle-halo"/>
                <!-- Flama amarilla/naranja -->
                <g class="candle-flame">
                    <path d="M 396,235 C 382,254 384,274 396,282 C 408,274 412,254 396,235 Z" fill="#ffc400" stroke="#2c0b3f" stroke-width="2"/>
                    <path d="M 396,249 C 390,260 391,272 396,278 C 401,272 403,260 396,249 Z" fill="#ff9100"/>
                    <!-- Pabilo -->
                    <line x1="396" y1="274" x2="396" y2="292" stroke="#2c0b3f" stroke-width="2.5" stroke-linecap="round"/>
                </g>
                <!-- Cuerpo cilíndrico blanco/crema de la vela -->
                <path d="M 374,295 C 374,289 418,289 418,295 L 418,348 C 418,354 374,354 374,348 Z" fill="#fcf5e3" stroke="#2c0b3f" stroke-width="2.5"/>
                <!-- Líneas de textura de cera como en la ilustración -->
                <path d="M 379,305 Q 396,308 412,305" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
                <path d="M 378,316 Q 396,320 413,316" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
                <path d="M 380,328 Q 396,331 411,328" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
                <path d="M 379,339 Q 396,342 412,339" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
            </g>

            <!-- MARCO DE FOTOGRAFÍA CENTRAL CON RETRATO 100% FIJO E INTEGRADO -->
            <g id="portraitFrameGroup" class="interactive-prop" onclick="triggerPortraitSparkle()" filter="url(#softShadow)">
                <!-- Marco exterior de madera café -->
                <rect x="440" y="204" width="120" height="150" rx="3" fill="#8b623b" stroke="#2c0b3f" stroke-width="3"/>
                <!-- Bisel interior del marco -->
                <rect x="448" y="212" width="104" height="134" rx="2" fill="#6d4929" stroke="#a67b51" stroke-width="2"/>
                <!-- Líneas diagonales de las esquinas de madera -->
                <line x1="440" y1="204" x2="453" y2="218" stroke="#4d3219" stroke-width="2"/>
                <line x1="560" y1="204" x2="547" y2="218" stroke="#4d3219" stroke-width="2"/>
                <line x1="440" y1="354" x2="453" y2="340" stroke="#4d3219" stroke-width="2"/>
                <line x1="560" y1="354" x2="547" y2="340" stroke="#4d3219" stroke-width="2"/>

                <!-- Fotografía fija embebida dentro del marco del altar con enlace directo y respaldos -->
                <g clip-path="url(#portraitPhotoClip)">
                    <rect x="453" y="218" width="94" height="122" fill="#bfb1aa"/>
                    <image href="https://i.ibb.co/q3NqRWy9/image.jpg"
                           x="453"
                           y="218"
                           width="94"
                           height="122"
                           preserveAspectRatio="xMidYMid slice"
                           crossorigin="anonymous"
                           onerror="this.href='https://kommodo.ai/i/xo6vG0SOclt0OUWDd8nj'"/>
                </g>
                <!-- Borde interior sutil del vidrio del portarretratos -->
                <rect x="453" y="218" width="94" height="122" rx="1.5" fill="none" stroke="#3d2612" stroke-width="1.2"/>
            </g>

            <!-- VELADORA DERECHA -->
            <g id="candleRight" class="interactive-prop" onclick="toggleCandle(1)" filter="url(#softShadow)">
                <!-- Halo luminoso -->
                <circle cx="604" cy="260" r="46" fill="url(#candleHaloGrad)" class="candle-halo"/>
                <!-- Flama amarilla/naranja -->
                <g class="candle-flame">
                    <path d="M 604,235 C 590,254 592,274 604,282 C 616,274 620,254 604,235 Z" fill="#ffc400" stroke="#2c0b3f" stroke-width="2"/>
                    <path d="M 604,249 C 598,260 599,272 604,278 C 609,272 611,260 604,249 Z" fill="#ff9100"/>
                    <!-- Pabilo -->
                    <line x1="604" y1="274" x2="604" y2="292" stroke="#2c0b3f" stroke-width="2.5" stroke-linecap="round"/>
                </g>
                <!-- Cuerpo cilíndrico blanco/crema de la vela -->
                <path d="M 582,295 C 582,289 626,289 626,295 L 626,348 C 626,354 582,354 582,348 Z" fill="#fcf5e3" stroke="#2c0b3f" stroke-width="2.5"/>
                <!-- Líneas de textura de cera -->
                <path d="M 587,305 Q 604,308 620,305" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
                <path d="M 586,316 Q 604,320 621,316" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
                <path d="M 588,328 Q 604,331 619,328" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
                <path d="M 587,339 Q 604,342 620,339" stroke="#d8ccb4" stroke-width="1.8" fill="none"/>
            </g>


            <!-- =============================================================

    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 w-[95%] max-w-2xl">

    <!-- =====================================================================
         LÓGICA INTERACTIVA, ANIMACIÓN DE CALAVERITAS Y MÚSICA WEB AUDIO API
         ===================================================================== -->
    <script>
        /* -----------------------------------------------------------------
           1. SISTEMA DE PARTÍCULAS Y LLUVIA DE PÉTALOS EN CANVAS
           ----------------------------------------------------------------- */
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        let ambientPetals = [];
        let burstParticles = [];

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);

        function createAmbientPetal() {
            const colors = ['#ff9800', '#ffb703', '#fb8500', '#d56ce8', '#eb1c74'];
            return {
                x: Math.random() * fxCanvas.width,
                y: -20 - Math.random() * fxCanvas.height,
                size: 4 + Math.random() * 5,
                vy: 0.45 + Math.random() * 0.9,
                vx: (Math.random() - 0.5) * 0.6,
                angle: Math.random() * Math.PI * 2,
                vAngle: (Math.random() - 0.5) * 0.025,
                sway: Math.random() * Math.PI * 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 0.35 + Math.random() * 0.4
            };
        }

        function initAmbientPetals() {
            resizeFxCanvas();
            ambientPetals = [];
            const total = window.innerWidth < 640 ? 18 : 30;
            for (let i = 0; i < total; i++) {
                const p = createAmbientPetal();
                p.y = Math.random() * fxCanvas.height;
                ambientPetals.push(p);
            }
        }

        // Convierte coordenadas del SVG (0..1000, 0..960) a coordenadas de pantalla
        function svgToScreenCoords(svgX, svgY) {
            const svgEl = document.getElementById('altarSvg');
            const rect = svgEl.getBoundingClientRect();
            const scaleX = rect.width / 1000;
            const scaleY = rect.height / 960;
            return {
                x: rect.left + svgX * scaleX,
                y: rect.top + svgY * scaleY
            };
        }

        function spawnSkullParticles(svgX, svgY, palette, shapeType = 'mixed', count = 34) {
            const pos = svgToScreenCoords(svgX, svgY);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6.5;
                burstParticles.push({
                    x: pos.x,
                    y: pos.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2.2,
                    gravity: 0.14,
                    size: 5 + Math.random() * 6,
                    angle: Math.random() * Math.PI * 2,
                    vAngle: (Math.random() - 0.5) * 0.14,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    alpha: 1,
                    decay: 0.014 + Math.random() * 0.012,
                    shape: shapeType
                });
            }
        }

        function renderFxLoop() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

            // Pétalos suaves de fondo
            for (let i = 0; i < ambientPetals.length; i++) {
                const p = ambientPetals[i];
                p.sway += 0.02;
                p.y += p.vy;
                p.x += p.vx + Math.sin(p.sway) * 0.4;
                p.angle += p.vAngle;

                if (p.y > fxCanvas.height + 20) {
                    ambientPetals[i] = createAmbientPetal();
                    ambientPetals[i].y = -15;
                }

                fxCtx.save();
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate(p.angle);
                fxCtx.globalAlpha = p.alpha;
                fxCtx.fillStyle = p.color;
                fxCtx.beginPath();
                fxCtx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
                fxCtx.fill();
                fxCtx.restore();
            }

            // Explosiones de partículas al tocar las calaveritas u objetos
            for (let i = burstParticles.length - 1; i >= 0; i--) {
                const b = burstParticles[i];
                b.x += b.vx;
                b.y += b.vy;
                b.vy += b.gravity;
                b.angle += b.vAngle;
                b.alpha -= b.decay;

                if (b.alpha <= 0) {
                    burstParticles.splice(i, 1);
                    continue;
                }

                fxCtx.save();
                fxCtx.translate(b.x, b.y);
                fxCtx.rotate(b.angle);
                fxCtx.globalAlpha = Math.max(0, b.alpha);
                fxCtx.fillStyle = b.color;

                if (b.shape === 'star') {
                    fxCtx.beginPath();
                    for (let s = 0; s < 5; s++) {
                        fxCtx.lineTo(Math.cos((18 + s * 72) * Math.PI / 180) * b.size,
                                     -Math.sin((18 + s * 72) * Math.PI / 180) * b.size);
                        fxCtx.lineTo(Math.cos((54 + s * 72) * Math.PI / 180) * (b.size * 0.45),
                                     -Math.sin((54 + s * 72) * Math.PI / 180) * (b.size * 0.45));
                    }
                    fxCtx.closePath();
                    fxCtx.fill();
                } else {
                    fxCtx.beginPath();
                    fxCtx.ellipse(0, 0, b.size, b.size * 0.62, 0, 0, Math.PI * 2);
                    fxCtx.fill();
                }
                fxCtx.restore();
            }

            requestAnimationFrame(renderFxLoop);
        }

        /* -----------------------------------------------------------------
           2. ANIMACIÓN INTERACTIVA DE LAS 3 CALAVERITAS DE AZÚCAR
           ----------------------------------------------------------------- */
        const skullTimers = { left: null, center: null, right: null };

        function animateSugarSkull(position, svgX, svgY) {
            ensureAudio();

            const idMap = {
                left: 'skullLeft',
                center: 'skullCenter',
                right: 'skullRight'
            };
            const classMap = {
                left: 'dancing-left',
                center: 'dancing-center',
                right: 'dancing-right'
            };

            const skullEl = document.getElementById(idMap[position]);
            const animClass = classMap[position];
            if (!skullEl) return;

            // Reinicia o activa el baile de la calaverita seleccionada
            skullEl.classList.remove(animClass);
            void skullEl.offsetWidth; // Reflow para reiniciar animación
            skullEl.classList.add(animClass);

            if (skullTimers[position]) clearTimeout(skullTimers[position]);
            skullTimers[position] = setTimeout(() => {
                skullEl.classList.remove(animClass);
            }, 2200);

            // Efectos particulares según la calaverita tocada
            if (position === 'left') {
                spawnSkullParticles(svgX, svgY, ['#ffd000', '#4ea8de', '#eb1c74', '#ffffff'], 'star', 36);
                playMarimbaRiff([523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50]);
                showToast('💀', '¡Calaverita de azúcar azul bailando con chispas doradas!');
            } else if (position === 'center') {
                spawnSkullParticles(svgX, svgY, ['#eb1c74', '#8c52ff', '#00bbf9', '#ffd000'], 'mixed', 38);
                playMarimbaRiff([440.00, 554.37, 659.25, 880.00, 659.25, 880.00]);
                showToast('🎶', '¡Calaverita central zapateando de alegría en el altar!');
            } else if (position === 'right') {
                spawnSkullParticles(svgX, svgY, ['#ff9800', '#ffb703', '#ff5d8f', '#74c69d'], 'petal', 40);
                playMarimbaRiff([587.33, 739.99, 880.00, 1174.66, 880.00, 1174.66]);
                showToast('🌼', '¡Calaverita coronada esparciendo pétalos de cempasúchil!');
            }
        }

        function triggerAllSkullsDance() {
            animateSugarSkull('left', 248, 610);
            setTimeout(() => animateSugarSkull('center', 500, 610), 180);
            setTimeout(() => animateSugarSkull('right', 735, 610), 360);
            showToast('🎉', '¡Baile de las tres Calaveritas de Azúcar en la ofrenda!');
        }

        /* -----------------------------------------------------------------
           3. VELADORAS, COPAL, RETRATO Y OTROS OBJETOS INTERACTIVOS
           ----------------------------------------------------------------- */
        const candlesLit = [true, true];

        function toggleCandle(idx) {
            ensureAudio();
            candlesLit[idx] = !candlesLit[idx];
            updateCandlesState();
            playNote(candlesLit[idx] ? 659.25 : 329.63, 0.45, 'sine');
            const xCoord = idx === 0 ? 396 : 604;
            if (candlesLit[idx]) {
                spawnSkullParticles(xCoord, 255, ['#ffc400', '#ff9100', '#fff3b0'], 'star', 18);
                showToast('🕯️', 'Veladora encendida para iluminar el camino');
            } else {
                showToast('🌙', 'Veladora apagada');
            }
        }

        function toggleAllCandles() {
            const anyOff = !candlesLit[0] || !candlesLit[1];
            candlesLit[0] = anyOff;
            candlesLit[1] = anyOff;
            updateCandlesState();
            ensureAudio();
            playNote(anyOff ? 783.99 : 293.66, 0.5, 'sine');
            showToast('🕯️', anyOff ? 'Las dos veladoras iluminan el retrato' : 'Veladoras en reposo');
        }

        function updateCandlesState() {
            const leftEl = document.getElementById('candleLeft');
            const rightEl = document.getElementById('candleRight');
            leftEl.classList.toggle('candle-off', !candlesLit[0]);
            rightEl.classList.toggle('candle-off', !candlesLit[1]);

            const activeCount = (candlesLit[0] ? 1 : 0) + (candlesLit[1] ? 1 : 0);
            document.documentElement.style.setProperty('--candle-glow', (activeCount / 2).toFixed(2));
        }

        function boostCopalSmoke(side, svgX, svgY) {
            ensureAudio();
            spawnSkullParticles(svgX, svgY - 40, ['#b8a9c9', '#d6cadd', '#e09f1f'], 'petal', 26);
            playMarimbaRiff([329.63, 440.00, 523.25]);
            showToast('🔥', 'El incienso de copal eleva su aroma purificador');
        }

        function burstMarigoldPetals(svgX, svgY) {
            ensureAudio();
            spawnSkullParticles(svgX, svgY, ['#ff9800', '#ffb703', '#fb8500'], 'petal', 35);
            playMarimbaRiff([523.25, 659.25, 783.99]);
            showToast('🌼', 'Pétalos de flor de cempasúchil esparcidos en el altar');
        }

        function triggerFoodChime(msg, svgX, svgY) {
            ensureAudio();
            spawnSkullParticles(svgX, svgY, ['#ffb703', '#fde68a', '#eb1c74'], 'star', 20);
            playMarimbaRiff([440, 523.25, 659.25]);
            showToast('✨', msg);
        }

        function playPaperRustle(svgX, svgY) {
            ensureAudio();
            spawnSkullParticles(svgX, svgY, ['#eb1c74', '#f9b90b', '#0d63b8', '#139a8c'], 'petal', 18);
            playNote(587.33, 0.35, 'triangle');
        }

        function triggerPortraitSparkle() {
            ensureAudio();
            spawnSkullParticles(500, 275, ['#ffd000', '#ffb703', '#ffffff', '#d56ce8'], 'star', 30);
            playMarimbaRiff([523.25, 659.25, 783.99, 1046.50]);
            showToast('🖼️', 'Con cariño y recuerdo eterno en la ofrenda');
        }

        /* -----------------------------------------------------------------
           4. MÚSICA DE FONDO TRADICIONAL (WEB AUDIO API) Y EFECTOS SONOROS
           ----------------------------------------------------------------- */
        let audioCtx = null;
        let masterGain = null;
        let musicPlaying = false;
        let musicTimer = null;
        let melodyIndex = 0;

        // Melodía tradicional estilo vals mexicano ("La Llorona" / "Vals de las Ánimas" en La menor)
        const traditionalSequence = [
            { bass: 220.00, note: 440.00 }, // Am
            { bass: 329.63, note: 523.25 },
            { bass: 329.63, note: 659.25 },
            { bass: 146.83, note: 587.33 }, // Dm
            { bass: 293.66, note: 523.25 },
            { bass: 349.23, note: 493.88 },
            { bass: 220.00, note: 523.25 }, // Am
            { bass: 329.63, note: 440.00 },
            { bass: 329.63, note: 392.00 },
            { bass: 164.81, note: 415.30 }, // E7
            { bass: 329.63, note: 493.88 },
            { bass: 415.30, note: 659.25 },
            { bass: 146.83, note: 587.33 }, // Dm
            { bass: 293.66, note: 523.25 },
            { bass: 349.23, note: 493.88 },
            { bass: 220.00, note: 440.00 }, // Am
            { bass: 164.81, note: 415.30 }, // E7
            { bass: 220.00, note: 440.00 }  // Am
        ];

        function ensureAudio() {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.32;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(freq, duration = 0.85, type = 'triangle', volume = 0.35) {
            if (!audioCtx || !masterGain) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(now);
            osc.stop(now + duration);
        }

        function playMarimbaRiff(freqs) {
            ensureAudio();
            freqs.forEach((f, idx) => {
                setTimeout(() => {
                    playNote(f, 0.32, 'sine', 0.42);
                    playNote(f * 2, 0.16, 'triangle', 0.15);
                }, idx * 75);
            });
        }

        function stepBackgroundMusic() {
            if (!musicPlaying) return;
            const item = traditionalSequence[melodyIndex % traditionalSequence.length];
            playNote(item.bass, 0.95, 'triangle', 0.22);
            setTimeout(() => {
                if (musicPlaying) playNote(item.note, 1.15, 'sine', 0.34);
            }, 40);

            melodyIndex++;
            musicTimer = setTimeout(stepBackgroundMusic, 380);
        }

        function toggleBackgroundMusic() {
            ensureAudio();
            musicPlaying = !musicPlaying;
            const icon = document.getElementById('musicBtnIcon');
            const label = document.getElementById('musicBtnLabel');

            if (musicPlaying) {
                icon.textContent = '⏸';
                label.textContent = 'Música: Sonando';
                stepBackgroundMusic();
                showToast('🎶', 'Música tradicional de Día de Muertos activada');
            } else {
                icon.textContent = '▶';
                label.textContent = 'Música de Ofrenda';
                if (musicTimer) clearTimeout(musicTimer);
            }
        }

        /* -----------------------------------------------------------------
           5. NOTIFICACIÓN TOAST
           ----------------------------------------------------------------- */
        let toastTimer = null;
        function showToast(emoji, text) {
            const box = document.getElementById('toastBox');
            document.getElementById('toastEmoji').textContent = emoji;
            document.getElementById('toastText').textContent = text;
            box.classList.remove('opacity-0', '-translate-y-3');
            box.classList.add('opacity-100', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.remove('opacity-100', 'translate-y-0');
                box.classList.add('opacity-0', '-translate-y-3');
            }, 2600);
        }

        window.onload = function() {
            initAmbientPetals();
            renderFxLoop();
        };
    </script>
